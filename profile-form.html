<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <link rel="icon" href="profile/western-logo.png">
  <title>Profile details</title>
  <style>
    :root { color-scheme: light; --ink:#182230; --muted:#667085; --line:#dfe5ee; --brand:#5b5ce2; --brand-dark:#4546c8; --surface:#fff; --danger:#c03942; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:36px 18px; background:radial-gradient(circle at 8% 8%,#e8eaff 0,transparent 32%),#f5f7fb; color:var(--ink); font:16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card { width:min(100%,680px); background:var(--surface); border:1px solid #e8ebf2; border-radius:22px; box-shadow:0 24px 70px #26334d13; overflow:hidden; }
    .header { padding:34px 40px 26px; border-bottom:1px solid #edf0f5; }
    .eyebrow { margin:0 0 8px; color:#090614; text-transform:uppercase; letter-spacing:.12em; font-size:.73rem; font-weight:750; }
    h1 { margin:0; font-size:clamp(1.6rem,4vw,2rem); letter-spacing:-.04em; }
    .subhead { margin:8px 0 0; color:var(--muted); }
    form { padding:30px 40px 36px; }
    .avatar-row { display:flex; align-items:center; gap:18px; margin-bottom:28px; }
    .avatar { width:82px; height:82px; flex:none; display:grid; place-items:center; overflow:hidden; border-radius:50%; border:1px solid var(--line); background:#f0f2ff; color:#7779c9; }
    .avatar svg { width:38px; height:38px; }
    .avatar img { width:100%; height:100%; object-fit:cover; }
    .upload-copy { min-width:0; }
    .upload-copy strong { display:block; margin-bottom:3px; }
    .hint { color:var(--muted); font-size:.86rem; }
    .file-label { display:inline-flex; align-items:center; justify-content:center; margin-top:10px; padding:8px 13px; border:1px solid var(--line); border-radius:9px; background:#fff; color:#344054; font-size:.88rem; font-weight:650; cursor:pointer; transition:.16s ease; }
    .file-label:hover { border-color:#aaaaf2; background:#f8f8ff; }
    input[type=file] { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; clip-path:inset(50%); }
    input[type=file]:focus-visible + .file-label { outline:3px solid #b9baff; outline-offset:2px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px 18px; }
    .field { min-width:0; }
    label.field-label { display:block; margin-bottom:7px; color:#344054; font-size:.9rem; font-weight:650; }
    .required { color:var(--danger); }
    input[type=text], select { width:100%; min-height:48px; padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font:inherit; outline:none; transition:border-color .16s, box-shadow .16s; }
    input::placeholder { color:#98a2b3; }
    input:focus, select:focus { border-color:#8586eb; box-shadow:0 0 0 3px #5b5ce21a; }
    [aria-invalid="true"] { border-color:var(--danger)!important; box-shadow:0 0 0 3px #c0394212!important; }
    .error { display:block; min-height:18px; margin-top:5px; color:var(--danger); font-size:.79rem; }
    .actions { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:24px; }
    .form-note { margin:0; color:var(--muted); font-size:.82rem; }
    button { min-height:48px; padding:0 21px; border:0; border-radius:10px; background:var(--brand); color:white; font:inherit; font-weight:700; cursor:pointer; transition:background .16s, transform .16s; }
    button:hover { background:var(--brand-dark); transform:translateY(-1px); }
    button:focus-visible { outline:3px solid #b9baff; outline-offset:3px; }
    .success { display:none; margin-top:20px; padding:12px 14px; border:1px solid #b8e2c7; border-radius:10px; background:#f0fbf4; color:#21643b; font-size:.9rem; }
    .success.show { display:block; }
    @media(max-width:560px) { body { padding:18px 12px; } .header { padding:26px 22px 21px; } form { padding:24px 22px 28px; } .grid { grid-template-columns:1fr; gap:14px; } .actions { align-items:stretch; flex-direction:column; } button { width:100%; } }
  </style>
</head>
<body>
  <main class="card">
    <header class="header">
      <p class="eyebrow">Your account</p>
      <h1 style="color:#0e1a2b">Profile details</h1>
      <p class="subhead">Add a photo and tell us where you’re based.</p>
    </header>
    <form id="profileForm" novalidate  action="profile_update.php" method="post" enctype="multipart/form-data">
      <section class="avatar-row" aria-label="Profile picture">
        <div class="avatar" id="avatarPreview" aria-label="Profile picture preview">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20c.7-4 3.2-6 7.5-6s6.8 2 7.5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <div class="upload-copy">
          <strong>Profile picture <span class="hint">(optional)</span></strong>
          <div class="hint">JPG, PNG, or WebP · up to 5 MB</div>
          <input id="picture" name="picture" type="file" accept="image/jpeg,image/png,image/webp">
          <label class="file-label" for="picture">Choose a photo</label>
          <span class="error" id="pictureError" aria-live="polite"></span>
        </div>
      </section>
      <div class="grid">
        <div class="field">
          <label class="field-label" for="region">Region <span class="required">*</span></label>
          <select id="region" name="region" required>
            <option value="">Select a region</option>
            <option>Africa</option><option>Asia</option><option>Europe</option><option>North America</option><option>Oceania</option><option>South America</option><option>Antarctica</option>
          </select>
          <span class="error" id="regionError" aria-live="polite"></span>
        </div>
        <div class="field">
          <label class="field-label" for="country">Country <span class="required">*</span></label>
          <input id="country" name="country" type="text" autocomplete="country-name" placeholder="e.g. Canada" required maxlength="80">
          <span class="error" id="countryError" aria-live="polite"></span>
        </div>
        <div class="field">
          <label class="field-label" for="state">State / Province <span class="required">*</span></label>
          <input id="state" name="state" type="text" autocomplete="address-level1" placeholder="e.g. Ontario" required maxlength="80">
          <span class="error" id="stateError" aria-live="polite"></span>
        </div>
        <div class="field">
          <label class="field-label" for="city">City <span class="required">*</span></label>
          <input id="city" name="city" type="text" autocomplete="address-level2" placeholder="e.g. Toronto" required maxlength="80">
          <span class="error" id="cityError" aria-live="polite"></span>
        </div>
      </div>
      <div class="actions">
        <p class="form-note"><span class="required">*</span> Required fields</p>
        <button type="submit" name="save_btn" style="background:#0a1627; color: #ffdc16;">Save profile</button>
      </div>
      <div class="success" id="successMessage" role="status">Your profile details are ready to save.</div>
    </form>
  </main>
  <script>
    const form = document.getElementById('profileForm');
    const pictureInput = document.getElementById('picture');
    const preview = document.getElementById('avatarPreview');
    const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
    const maxSize = 5 * 1024 * 1024;
    let previewUrl;

    function showError(field, message) {
      const control = document.getElementById(field);
      const error = document.getElementById(field + 'Error');
      control.setAttribute('aria-invalid', message ? 'true' : 'false');
      error.textContent = message;
    }

    pictureInput.addEventListener('change', () => {
      const file = pictureInput.files[0];
      const error = document.getElementById('pictureError');
      error.textContent = '';
      if (!file) return;
      if (!allowedTypes.includes(file.type)) {
        error.textContent = 'Choose a JPG, PNG, or WebP image.';
        pictureInput.value = '';
        return;
      }
      if (file.size > maxSize) {
        error.textContent = 'The image must be 5 MB or smaller.';
        pictureInput.value = '';
        return;
      }
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(file);
      preview.replaceChildren();
      const image = document.createElement('img');
      image.src = previewUrl;
      image.alt = 'Selected profile picture';
      preview.append(image);
    });

   
  </script>
</body>
</html>
